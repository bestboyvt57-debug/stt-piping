<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#13202B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CGF Locator">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<title>CGF Topside Locator</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: left = coordinate console + grid report; right = steel layout canvas (pan/zoom). Stacks on phone. */
:root{
  --paper:#EDF1F4; --panel:#FFFFFF; --ink:#13202B; --muted:#5A6774; --line:#D2DAE2;
  --steel:#2A3540; --steel2:#8A97A3; --col:#2F6FA8; --cl:#B88A00;
  --grid:#0A6CFF; --gridtxt:#0A6CFF; --dim:#2E7D4F;
  --hot:#FF4D00; --hot-soft:rgba(255,77,0,.18); --lead:#C2412D; --pt2:#7B2FBF;
  --canvas:#FAFBFC;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0C1218; --panel:#141D26; --ink:#E3EAF1; --muted:#90A0AF; --line:#26333F;
  --steel:#C9D3DC; --steel2:#5E6C79; --col:#6FAFE6; --cl:#E3B83A;
  --grid:#4C9BFF; --gridtxt:#7DB6FF; --dim:#62C48C; --hot:#FF6A2B; --hot-soft:rgba(255,106,43,.22); --lead:#F07A63; --pt2:#B985F0;
  --canvas:#0F171E; color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#0C1218; --panel:#141D26; --ink:#E3EAF1; --muted:#90A0AF; --line:#26333F;
  --steel:#C9D3DC; --steel2:#5E6C79; --col:#6FAFE6; --cl:#E3B83A;
  --grid:#4C9BFF; --gridtxt:#7DB6FF; --dim:#62C48C; --hot:#FF6A2B; --hot-soft:rgba(255,106,43,.22); --lead:#F07A63; --pt2:#B985F0;
  --canvas:#0F171E; color-scheme:dark }
html,body{height:100%}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:minmax(300px,390px) 1fr;grid-template-rows:auto 1fr;gap:12px;height:100%;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px}
header{grid-column:1/-1;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
h1{font-family:var(--f-display);font-weight:700;font-size:26px;margin:0;line-height:1;letter-spacing:.01em}
h1 span{color:var(--hot)}
header .sub{color:var(--muted);font-size:13px}
.console{display:flex;flex-direction:column;gap:12px;overflow:auto;min-width:0;padding-bottom:6px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.box h2{margin:0;font-family:var(--f-display);font-weight:600;font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.fl{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
input[type=text],input[type=number],select{width:100%;border:1px solid var(--line);background:var(--paper);border-radius:4px;padding:9px 10px;font-family:var(--f-mono);font-size:15px;outline:none}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--hot);outline-offset:1px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.sep{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600;margin:10px 0}
.sep::before,.sep::after{content:"";flex:1;height:1px;background:var(--line)}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:4px;padding:8px 12px;cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--muted)}
.btn.go{background:var(--hot);border-color:var(--hot);color:#fff}
.hint{font-size:12.5px;color:var(--muted);margin:0}
.big{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-family:var(--f-mono);font-variant-numeric:tabular-nums;align-items:baseline}
.big .k{font-family:var(--f-display);font-weight:700;font-size:17px;color:var(--hot)}
.big .v{font-size:20px;font-weight:600}
.grid-rep{display:flex;flex-direction:column;gap:8px}
.gr{border-left:4px solid var(--grid);background:var(--paper);border-radius:0 4px 4px 0;padding:8px 10px;display:flex;flex-direction:column;gap:2px}
.gr .t{font-family:var(--f-display);font-weight:600;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.gr .m{font-family:var(--f-mono);font-size:15px;font-variant-numeric:tabular-nums}
.gr .m b{color:var(--hot)}
.gr .s{font-size:12.5px;color:var(--muted);font-family:var(--f-mono)}
.pill{display:inline-block;font-family:var(--f-display);font-weight:600;font-size:12px;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:3px;background:var(--hot-soft);color:var(--hot)}
.plist{display:flex;flex-direction:column}
.plist button{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;text-align:left;border:0;border-top:1px solid var(--line);background:none;padding:7px 2px;cursor:pointer;min-width:0}
.plist button:first-child{border-top:0}
.plist button.on{background:var(--hot-soft)}
.plist .dot{width:10px;height:10px;border-radius:50%;background:var(--pt2)}
.plist button.on .dot{background:var(--hot)}
.plist .n{font-family:var(--f-mono);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.plist .x{color:var(--muted);font-size:13px;padding:0 6px}
.empty{color:var(--muted);font-size:13px}
.viewer{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--panel);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 12px;cursor:pointer;font-family:var(--f-display);font-weight:600;font-size:15px;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap;display:flex;gap:6px;align-items:baseline}
.tabs button small{font-family:var(--f-mono);font-size:11px;font-weight:400}
.tabs button.on{color:var(--ink);border-bottom-color:var(--hot)}
.vp{position:relative;flex:1;min-height:0;background:var(--canvas);touch-action:none;cursor:grab}
.vp.drag{cursor:grabbing}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.tools{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px}
.tools button{width:38px;height:38px;border-radius:4px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-size:18px;font-weight:600}
.readout{position:absolute;left:10px;bottom:10px;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:6px 10px;font-family:var(--f-mono);font-size:12.5px;font-variant-numeric:tabular-nums;max-width:calc(100% - 20px)}
.readout b{color:var(--hot)}
.legend{display:flex;gap:14px;flex-wrap:wrap;align-items:center;padding:8px 12px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.legend label{display:flex;gap:6px;align-items:center;cursor:pointer}
.sw{display:inline-block;width:18px;height:3px;vertical-align:middle}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:8px 14px;border-radius:4px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50}
.toast.on{opacity:1}
#iPaste{width:100%;border:1px solid var(--line);background:var(--paper);border-radius:4px;padding:8px 10px;font-family:var(--f-mono);font-size:13px;resize:vertical}
.app{grid-template-areas:"h h" "c v"}
header{grid-area:h} .console{grid-area:c} .viewer{grid-area:v}
.more{display:flex;flex-direction:column;gap:12px}
#bMore{display:none}
.clr-wrap{position:relative}
.clr-wrap input{padding-right:42px !important}
.clr{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:36px;height:36px;border:0;border-radius:50%;background:none;color:var(--muted);font-size:16px;cursor:pointer;display:grid;place-items:center}
.clr:hover{background:var(--line);color:var(--ink)}
.clr[hidden]{display:none}
#iMulti{width:100%;border:1px solid var(--line);background:var(--paper);border-radius:4px;padding:8px 10px;font-family:var(--f-mono);font-size:14px;resize:vertical}
.msum{font-size:12.5px;color:var(--muted)}
.mwrap{overflow:auto;max-height:46vh;border:1px solid var(--line);border-radius:4px}
.mtab{width:100%;border-collapse:collapse;font-family:var(--f-mono);font-size:12.5px;font-variant-numeric:tabular-nums}
.mtab th{position:sticky;top:0;background:var(--panel);font-family:var(--f-display);font-weight:600;text-transform:uppercase;letter-spacing:.05em;font-size:11.5px;color:var(--muted);text-align:left;padding:6px;border-bottom:1px solid var(--line);white-space:nowrap}
.mtab td{padding:7px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
.mtab tbody tr{cursor:pointer}
.mtab tbody tr:hover,.mtab tbody tr.on{background:var(--hot-soft)}
.mtab td.n b{color:var(--pt2)}
.mtab tr.on td.n b{color:var(--hot)}
.mtab td.n small{color:var(--muted);font-size:10.5px}
.mmiss{color:var(--hot);font-size:12.5px;word-break:break-word}
.tabs .cnt{font-family:var(--f-mono);font-size:10.5px;font-weight:600;background:var(--pt2);color:#fff;border-radius:9px;padding:0 6px;line-height:17px}
.gate{position:fixed;inset:0;z-index:100;background:var(--paper);display:grid;place-items:center;padding:16px}
body.locked .app{visibility:hidden}
.gbox{width:100%;max-width:360px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:24px;display:flex;flex-direction:column;gap:10px}
.glogo{font-family:var(--f-display);font-weight:700;font-size:26px;line-height:1}
.glogo span{color:var(--hot)}
.gsub{margin:0 0 6px;color:var(--muted);font-size:13.5px}
#gPw{width:100%;border:1px solid var(--line);background:var(--paper);border-radius:4px;padding:11px 12px;font-family:var(--f-mono);font-size:16px;outline:none}
#gPw:focus-visible{outline:2px solid var(--hot);outline-offset:1px}
.gchk{display:flex;gap:8px;align-items:center;font-size:13.5px;color:var(--muted);cursor:pointer}
.gbox .btn{min-height:44px;font-size:15px}
.gbox .btn:disabled{opacity:.7;cursor:wait}
.gerr{color:var(--hot);font-size:13.5px;min-height:1.2em}
@media (max-width:860px){
  html,body{height:100%;overflow:hidden}
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;grid-template-areas:"h" "v" "c";
    height:100vh;height:100dvh;gap:8px;padding-top:max(8px,env(safe-area-inset-top,0px));padding-bottom:max(8px,env(safe-area-inset-bottom,0px))}
  header{gap:8px} h1{font-size:20px} header .sub{display:none}
  .viewer{min-height:0}
  .tabs button{padding:9px 10px;font-size:14px}
  .tools{right:8px;top:8px}
  .tools button{width:44px;height:44px}
  .readout{left:8px;bottom:8px;font-size:12px}
  .legend{flex-wrap:nowrap;overflow-x:auto;white-space:nowrap;padding:6px 10px;gap:12px}
  .console{max-height:52vh;max-height:52dvh;overflow:auto;gap:8px;padding-bottom:0;overscroll-behavior:contain}
  .box{padding:10px 12px;gap:8px}
  .b-in h2{display:none}
  .b-in > .field .fl{display:none}
  .b-in .row3 .fl{font-size:10px;letter-spacing:.04em}
  .b-in .row3 .field{gap:2px}
  .readout.idle{display:none}
  .fl{font-size:11px}
  input[type=text],input[type=number],#iMulti{font-size:16px;padding:10px}
  .row3{gap:6px}
  .btns{flex-wrap:nowrap}
  .btns .btn{flex:1;min-height:44px;padding:8px 6px;white-space:nowrap}
  #bMore{display:block;flex:0 0 auto;padding:8px 12px}
  .more{display:none} .more.open{display:flex}
  .plist button{min-height:44px}
}
/* ---- 3D (chèn bởi Build_Web3D.ps1) ---- */
.vbar{display:flex;align-items:stretch;border-bottom:1px solid var(--line);min-width:0}
.vbar .tabs{border-bottom:0;flex:1;min-width:0}
.mode{display:flex;padding:6px 8px;border-right:1px solid var(--line);align-items:center;flex:0 0 auto}
.mode button{border:1px solid var(--line);background:var(--panel);padding:5px 12px;min-height:32px;font-family:var(--f-display);font-weight:700;font-size:14px;letter-spacing:.04em;cursor:pointer;color:var(--muted)}
.mode button:first-child{border-radius:4px 0 0 4px}
.mode button:last-child{border-radius:0 4px 4px 0;border-left:0}
.mode button.on{background:var(--ink);color:var(--panel);border-color:var(--ink)}
#ov3{pointer-events:none}
#gl3{touch-action:none;cursor:grab}
#gl3:active{cursor:grabbing}
.msg3{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:max-content;max-width:min(440px,calc(100% - 32px));background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px;font-size:13.5px;display:flex;flex-direction:column;gap:8px;align-items:flex-start;z-index:2}
#leg3 small{color:var(--muted)}
#leg3 input{margin:0}
.vp canvas[hidden],#leg3[hidden],#msg3[hidden],.tools button[hidden]{display:none !important}
.pk3{max-height:7.5em;overflow:auto}
.pk3 div{white-space:nowrap}
.tools button.on{background:var(--ink);color:var(--panel);border-color:var(--ink)}
@media (max-width:860px){
  .mode{padding:4px 6px} .mode button{min-height:36px;padding:4px 10px}
  /* 3D trên điện thoại: dành chỗ cho khung 3D, phần tìm kiếm thu gọn và cuộn được */
  body.m3d .console{max-height:34vh;max-height:34dvh}
  body.m3d #leg3{padding:4px 8px;gap:10px;font-size:12px}
  body.m3d #leg3 small{display:none}
  body.m3d .readout{font-size:11px;padding:4px 8px;right:60px;max-width:none;overflow-x:auto}
  body.m3d .pk3{max-height:4.6em}
}
</style>

</head>
<body>
<script>document.body.classList.add("locked")</script>
<div class="app">
  <header>
    <h1>CGF Topside <span>Locator</span></h1>
    <span class="sub">Datum A/1 = W 116 025 · N 88 250 · Nhập tọa độ để định vị trên mặt bằng kết cấu và đo khoảng cách tới trục</span>
  </header>

  <section class="viewer">
    <div class="vbar"><div class="mode" role="group" aria-label="Chế độ xem"><button id="m2d" class="on" aria-pressed="true" title="Mặt bằng 2D">2D</button><button id="m3d" aria-pressed="false" title="Mô hình 3D từ Navisworks">3D</button></div><nav class="tabs" id="tabs"></nav></div>
    <div class="vp" id="vp">
      <canvas id="cv"></canvas>
      <canvas id="gl3" hidden></canvas>
      <canvas id="ov3" hidden></canvas>
      <div class="msg3" id="msg3" hidden></div>
      <div class="tools">
        <button id="zIn" title="Phóng to" aria-label="Phóng to">+</button>
        <button id="zOut" title="Thu nhỏ" aria-label="Thu nhỏ">−</button>
        <button id="zFit" title="Xem toàn bộ" aria-label="Xem toàn bộ">⤢</button>
        <button id="zPt" title="Về điểm đang chọn" aria-label="Về điểm đang chọn">◎</button>
        <button id="zPan" title="Pan: kéo để di chuyển" aria-label="Pan" aria-pressed="false" hidden>✥</button>
        <button id="zRot" title="Orbit: kéo để xoay" aria-label="Orbit" aria-pressed="true" hidden>⟳</button>
      </div>
      <div class="readout idle" id="readout">Di chuột / chạm vào bản vẽ để xem tọa độ</div>
    </div>
    <div class="legend" id="leg3" hidden></div>

  </section>

  <aside class="console">
    <section class="box b-in">
      <h2>Tìm kiếm</h2>
      <div class="field">
        <label class="fl" for="iName">Tên piping support / spool</label>
        <div class="clr-wrap">
          <input type="text" id="iName" list="supList" placeholder="Nhập tên piping support / spool" autocomplete="off" enterkeyhint="search">
          <button type="button" class="clr" id="bClr" title="Xóa nội dung" aria-label="Xóa nội dung" hidden>✕</button>
        </div>
        <datalist id="supList"></datalist>
      </div>
      <div class="sep">hoặc theo tọa độ</div>
      <div class="row3">
        <div class="field"><label class="fl" for="iW">W (mm)</label><input type="number" id="iW" placeholder="W" inputmode="decimal" step="any" enterkeyhint="go"></div>
        <div class="field"><label class="fl" for="iN">N (mm)</label><input type="number" id="iN" placeholder="N" inputmode="decimal" step="any" enterkeyhint="go"></div>
        <div class="field"><label class="fl" for="iU">U / EL (mm)</label><input type="number" id="iU" placeholder="U / EL" inputmode="decimal" step="any" enterkeyhint="go"></div>
      </div>
      <div class="btns">
        <button class="btn go" id="bGo">Tìm kiếm</button>
        <button class="btn" id="bMore" aria-expanded="false">Nhiều support ▾</button>
      </div>
    </section>
    <div class="more" id="more">
      <section class="box">
        <h2>Tìm nhiều support</h2>
        <div class="field">
          <label class="fl" for="iMulti">Danh sách support (mỗi dòng 1 tên, hoặc cách nhau bằng dấu phẩy)</label>
          <textarea id="iMulti" rows="5" placeholder="PS-XCGEH22B-5001&#10;EH22B-5002&#10;5003, 5004"></textarea>
        </div>
        <div class="btns">
          <button class="btn go" id="bMulti">Hiển thị</button>
          <button class="btn" id="bMAll">Xem tất cả</button>
          <button class="btn" id="bMClr">Xóa</button>
        </div>
        <div id="mRes"></div>
      </section>
    </div>
  </aside>
</div>
<div class="toast" id="toast"></div>

<div class="gate" id="gate">
  <form class="gbox" id="gForm" autocomplete="off">
    <div class="glogo">CGF Topside <span>Locator</span></div>
    <p class="gsub">Tài liệu nội bộ dự án. Nhập mật khẩu để tiếp tục.</p>
    <label class="fl" for="gPw">Mật khẩu</label>
    <input type="password" id="gPw" autocomplete="current-password" enterkeyhint="go" required>
    <label class="gchk"><input type="checkbox" id="gRem"> Ghi nhớ trên thiết bị này</label>
    <button class="btn go" id="gBtn" type="submit">Vào</button>
    <div class="gerr" id="gErr" role="alert"></div>

<script>
(function(){
"use strict";
const KEY='cgf-loc-pw';
const b64 = s => Uint8Array.from(atob(s), c=>c.charCodeAt(0));
async function unlock(pw){
  const raw = b64(document.getElementById('enc').textContent.trim());
  const salt=raw.slice(0,16), iv=raw.slice(16,28), ct=raw.slice(28);
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt, iterations:250000, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['decrypt']);
  const gz = await crypto.subtle.decrypt({name:'AES-GCM', iv}, key, ct);
  const txt = await new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
  return JSON.parse(txt);
}
const gate=document.getElementById('gate'), f=document.getElementById('gForm'), pw=document.getElementById('gPw'), err=document.getElementById('gErr'), btn=document.getElementById('gBtn');
async function tryPw(p, quiet){
  btn.disabled=true; btn.textContent='Đang mở…'; err.textContent='';
  try{
    const d = await unlock(p);
    try{ sessionStorage.setItem(KEY,p); if (document.getElementById('gRem').checked) localStorage.setItem(KEY,p); }catch(e){}
    gate.remove(); document.body.classList.remove('locked');
    startApp(d.g, d.s, p); return true;
  }catch(e){
    if (!quiet){ err.textContent = (e && e.name==='OperationError') ? 'Sai mật khẩu.' : 'Không mở được dữ liệu: '+(e&&e.message||e); pw.select(); }
    try{ sessionStorage.removeItem(KEY); localStorage.removeItem(KEY); }catch(_){}
    btn.disabled=false; btn.textContent='Vào'; return false;
  }
}
f.addEventListener('submit', e=>{ e.preventDefault(); tryPw(pw.value); });
let saved=null; try{ saved = sessionStorage.getItem(KEY) || localStorage.getItem(KEY); }catch(e){}
if (saved) tryPw(saved, true); else pw.focus();
})();

function startApp(GEOM, SUPS, PW){
"use strict";
const W0 = 116025, N0 = 88250;               // datum A/1
const toX = W => W0 - W, toY = N => N - N0;  // CAD: X east, Y north (mm)

const DECK_N = [['1',88250],['2',96250],['3',104250],['3.1',117000],['4',129750],['5',139750],['6',155250]];
const DECK_W = [['A',116025],['B',132025],['C',148025]];
const EH_N = [['1A',84500],['1B',87295],['1',88250],['2A',94595],['2',96250]];
const EH_W = [['A',116025],['B',132025],['E2',140025]];
const EH_BOX = {w1:116025-600, w2:140025+600, n1:84500-600, n2:96250+600};

const LAYOUTS = [
  {k:'MD', name:'Main Deck', tos:34000, eh:false},
  {k:'ID', name:'Intermediate Deck', tos:26000, eh:false},
  {k:'CD', name:'Cellar Deck', tos:18000, eh:false},
  {k:'SD', name:'Sub-Cellar Deck', tos:13500, eh:false},
  {k:'EH-Lv2', g:'EH-2F', name:'E-House Level 2', tos:31864, eh:true},
  {k:'EH-Lv3', g:'EH-RF', name:'E-House Level 3', tos:36290, eh:true},
];
const LAYERS = ['STEEL-SEC','COLUMN','STEEL','CL'];

/* ---------- geometry → Path2D (world mm) ---------- */
for (const L of LAYOUTS){
  const g = GEOM[L.g||L.k] || {};
  L.paths = {}; let x1=Infinity,y1=Infinity,x2=-Infinity,y2=-Infinity;
  for (const ly of LAYERS){
    const a = g[ly]; if (!a || !a.length) continue;
    const p = new Path2D();
    for (let i=0;i<a.length;i+=4){
      const ax=a[i]*10, ay=a[i+1]*10, bx=a[i+2]*10, by=a[i+3]*10;
      p.moveTo(ax,ay); p.lineTo(bx,by);
      if (ax<x1)x1=ax; if (bx<x1)x1=bx; if (ax>x2)x2=ax; if (bx>x2)x2=bx;
      if (ay<y1)y1=ay; if (by<y1)y1=by; if (ay>y2)y2=ay; if (by>y2)y2=by;
    }
    L.paths[ly]=p;
  }
  L.bbox = {x1,y1,x2,y2};
  L.gN = L.eh ? EH_N : DECK_N;
  L.gW = L.eh ? EH_W : DECK_W;
}

/* ---------- state ---------- */
const S = { lay: LAYOUTS[0], pts: [], act: -1, multi: [], mSel: -1, mMiss: [], view:{s:0.02, ox:0, oy:0}, show:{STEEL:1,'STEEL-SEC':1,COLUMN:1,CL:1,SUP:0}, mouse:null };
const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d'), vp = $('vp');
let C = {};
function readColors(){
  const cs = getComputedStyle(document.documentElement);
  for (const n of ['steel','steel2','col','cl','grid','gridtxt','dim','hot','lead','pt2','canvas','ink','muted','panel','line'])
    C[n] = cs.getPropertyValue('--'+n).trim();
}
readColors();
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', ()=>{ readColors(); draw(); });

/* ---------- number formatting ---------- */
const fmt = v => Math.round(v).toLocaleString('en-US');
const fmt1 = v => (Math.round(v*10)/10).toLocaleString('en-US');

/* ---------- grid analysis ---------- */
function gridInfo(val, grids, kind){
  // kind 'N' -> + = Bắc, 'W' -> + = Tây
  const pos = kind==='N' ? 'Bắc' : 'Tây', neg = kind==='N' ? 'Nam' : 'Đông';
  let best=null;
  for (const [n,g] of grids){ const d = val-g; if (!best || Math.abs(d)<Math.abs(best.d)) best={n,g,d}; }
  const sorted = grids.slice().sort((a,b)=>a[1]-b[1]);
  let lo=null, hi=null;
  for (const gr of sorted){ if (gr[1]<=val) lo=gr; if (gr[1]>val && !hi) hi=gr; }
  return {best, lo, hi, side: d => d===0 ? 'nằm trên trục' : (d>0 ? 'phía '+pos : 'phía '+neg), pos, neg};
}
function pickLayout(W,N,U){
  const inEH = W>=EH_BOX.w1 && W<=EH_BOX.w2 && N>=EH_BOX.n1 && N<=EH_BOX.n2;
  if (U==null || isNaN(U)) return inEH ? LAYOUTS[4] : LAYOUTS[0];
  if (inEH && U>=28000) return U>=34500 ? LAYOUTS[5] : LAYOUTS[4];
  const decks = LAYOUTS.slice(0,4).filter(l=>{
    if (l.k!=='SD') return true;
    const y=toY(N); return y>=l.bbox.y1-2000 && y<=l.bbox.y2+2000; // SD covers part of platform only
  });
  let pick=null;
  for (const l of decks) if (U>=l.tos-300 && (!pick || l.tos>pick.tos)) pick=l;
  return pick || decks.reduce((a,b)=>a.tos<b.tos?a:b);
}

/* ---------- parse input ---------- */
function parseLine(s){
  s = s.trim(); if (!s) return null;
  const num = '(-?\\d[\\d,]*(?:\\.\\d+)?)\\s*(?:mm|m)?';
  const get = (re) => { const m = s.match(re); return m ? parseFloat(m[1].replace(/,/g,'')) : null; };
  let W = get(new RegExp('\\bW\\s*[:=]?\\s*'+num,'i'));
  let E = get(new RegExp('\\bE\\s*[:=]?\\s*'+num,'i'));
  let N = get(new RegExp('\\bN\\s*[:=]?\\s*'+num,'i'));
  let So = get(new RegExp('\\bS\\s*[:=]?\\s*'+num,'i'));
  let U = get(new RegExp('\\b(?:U|EL|EL\\.|Z)\\s*[:=]?\\s*'+num,'i'));
  let D = get(new RegExp('\\bD\\s*[:=]?\\s*'+num,'i'));
  if (W==null && E!=null) W=-E; if (N==null && So!=null) N=-So; if (U==null && D!=null) U=-D;
  if (W==null || N==null){
    const nums = (s.match(/-?\d[\d,]*(?:\.\d+)?/g)||[]).map(x=>parseFloat(x.replace(/,/g,''))).filter(x=>Math.abs(x)>1000);
    if (nums.length>=2){ W=nums[0]; N=nums[1]; U = nums[2]!=null ? nums[2] : U; }
  }
  if (W==null || N==null) return null;
  let name = s.replace(/\b[WENSUDZ]\s*[:=]?\s*-?\d[\d,]*(?:\.\d+)?\s*(?:mm|m)?/gi,'').replace(/\bEL\.?\s*-?\d.*$/i,'').trim();
  if (/^[-\d.,\s]*$/.test(name)) name='';
  return {name: name.replace(/^\//,''), W, N, U};
}

/* ---------- points ---------- */
function addPoint(p){
  p.lay = pickLayout(p.W,p.N,p.U);
  S.pts = [p]; S.act = 0;
  setLayout(p.lay, false);
  focusPoint(p);
  renderList(); renderReport(); saveHash();
  if (isMobile() && document.activeElement && document.activeElement.blur) document.activeElement.blur();
}
function focusPoint(p){
  if (S.mode==='3d') V3.focus(p);
  const r = vp.getBoundingClientRect();
  const span = 30000; // ~30 m quanh điểm
  const s = Math.min(r.width, r.height)/span;
  S.view.s = s; S.view.ox = r.width/2 - toX(p.W)*s; S.view.oy = r.height/2 + toY(p.N)*s;
  draw();
}
function fillInputs(p){
  $('iName').value=p.name||''; $('iW').value=+p.W.toFixed(1); $('iN').value=+p.N.toFixed(1); $('iU').value = p.U==null?'':+p.U.toFixed(1);
}

/* ---------- report ---------- */
function grBlock(title, val, grids, kind){
  const gi = gridInfo(val, grids, kind);
  const b = gi.best, d = b.d;
  let s = `<div class="gr"><span class="t">${title}</span>`;
  s += `<span class="m">Gần nhất: trục <b>${b.n}</b> — <b>${fmt(Math.abs(d))}</b> mm, ${gi.side(d)}</span>`;
  if (gi.lo && gi.hi) s += `<span class="s">Giữa trục ${gi.lo[0]} (+${fmt(val-gi.lo[1])}) và ${gi.hi[0]} (−${fmt(gi.hi[1]-val)}) · nhịp ${fmt(gi.hi[1]-gi.lo[1])}</span>`;
  else if (gi.lo) s += `<span class="s">Ngoài trục biên ${gi.lo[0]} về phía ${gi.pos}</span>`;
  else if (gi.hi) s += `<span class="s">Ngoài trục biên ${gi.hi[0]} về phía ${gi.neg}</span>`;
  return s+'</div>';
}
function renderReport(){
  if (!$('repBody')) return;
  const p = S.pts[S.act];
  $('repEmpty').hidden = !!p; const rb = $('repBody'); rb.hidden = !p;
  if (!p) return;
  const L = p.lay;
  const inEH = p.W>=EH_BOX.w1 && p.W<=EH_BOX.w2 && p.N>=EH_BOX.n1 && p.N<=EH_BOX.n2;
  let h = '';
  if (p.name) h += `<div style="font-family:var(--f-mono);font-size:13px;word-break:break-all">${esc(p.name)}</div>`;
  h += `<div class="big"><span class="k">W</span><span class="v">${fmt1(p.W)}</span><span class="k">N</span><span class="v">${fmt1(p.N)}</span>`;
  if (p.U!=null) h += `<span class="k">U</span><span class="v">${fmt1(p.U)}</span>`;
  h += `</div>`;
  h += `<div><span class="pill">${L.name}</span> <span class="hint" style="display:inline">TOS ${fmt(L.tos)}${p.U!=null?` · so với TOS: <b>${sgn(p.U-L.tos)}</b> mm`:''}</span></div>`;
  const key = (a,b)=>`<div class="gr" style="border-left-color:var(--hot)"><span class="t">Tóm tắt</span><span class="m">${a}: <b>${b}</b></span></div>`;
  const gN = gridInfo(p.N, inEH && L.eh ? EH_N : DECK_N,'N').best, gW = gridInfo(p.W, inEH && L.eh ? EH_W : DECK_W,'W').best;
  h += key(`${gN.n} / ${gW.n}`, `${fmt(Math.abs(gN.d))} / ${fmt(Math.abs(gW.d))} mm`);
  h += grBlock('Theo phương Bắc–Nam (trục số) · Topside', p.N, DECK_N, 'N');
  h += grBlock('Theo phương Đông–Tây (trục chữ) · Topside', p.W, DECK_W, 'W');
  if (inEH){
    h += grBlock('Bắc–Nam · trục E-House', p.N, EH_N, 'N');
    h += grBlock('Đông–Tây · trục E-House', p.W, EH_W, 'W');
  }
  h += `<div class="gr" style="border-left-color:var(--muted)"><span class="t">So với datum A/1</span><span class="m">ΔN ${sgn(p.N-N0)} · ΔW ${sgn(p.W-W0)}</span><span class="s">CAD X = ${fmt(toX(p.W))}, Y = ${fmt(toY(p.N))}${p.U!=null?`, Z = ${fmt(p.U)}`:''}</span></div>`;
  h += `<div class="btns"><button class="btn" id="bCopy">Copy kết quả</button><button class="btn" id="bLink">Copy link</button></div>`;
  rb.innerHTML = h;
  $('bCopy').onclick = ()=>copy(reportText(p));
  $('bLink').onclick = ()=>{ saveHash(); copy(location.href); };
}
const sgn = v => (v>=0?'+':'−')+fmt(Math.abs(v));
function reportText(p){
  const n = gridInfo(p.N,DECK_N,'N'), w = gridInfo(p.W,DECK_W,'W');
  return `${p.name?p.name+' ':''}W ${fmt1(p.W)} N ${fmt1(p.N)}${p.U!=null?' U '+fmt1(p.U):''} | ${p.lay.name} | `+
    `trục ${n.best.n}: ${fmt(Math.abs(n.best.d))} (${n.side(n.best.d)}), trục ${w.best.n}: ${fmt(Math.abs(w.best.d))} (${w.side(w.best.d)})`;
}
const esc = s => s.replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function copy(t){ (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(()=>toast('Đã copy'),()=>{ prompt('Copy:',t); }); }
let tt; function toast(m){ const e=$('toast'); e.textContent=m; e.classList.add('on'); clearTimeout(tt); tt=setTimeout(()=>e.classList.remove('on'),1600); }

/* ---------- list ---------- */
function renderList(){
  const el = $('plist'); if (!el) return;
  if (!S.pts.length){ el.innerHTML='<div class="empty">Trống</div>'; return; }
  el.innerHTML = S.pts.map((p,i)=>`<button data-i="${i}" class="${i===S.act?'on':''}"><span class="dot"></span><span class="n">${esc(p.name||('Điểm '+(i+1)))} · ${p.lay.k}</span><span class="x" data-x="${i}" title="Xóa" aria-label="Xóa">✕</span></button>`).join('');
  el.querySelectorAll('button').forEach(b=>b.onclick = e=>{
    const x = e.target.dataset.x;
    if (x!=null){ S.pts.splice(+x,1); if (S.act>=S.pts.length) S.act=S.pts.length-1; renderList(); renderReport(); draw(); saveHash(); return; }
    S.act = +b.dataset.i; const p=S.pts[S.act]; fillInputs(p); setLayout(p.lay,false); focusPoint(p); renderList(); renderReport();
  });
}

/* ---------- tabs ---------- */
function renderTabs(){
  if (S.mode==='3d'){ V3.renderTabs(); return; }
  $('tabs').innerHTML = LAYOUTS.map(l=>{ const c=S.multi.filter(q=>q.lay===l).length;
    return `<button data-k="${l.k}" class="${l===S.lay?'on':''}">${l.k}<small>${(l.tos/1000).toFixed(l.tos%1000?3:0)}</small>${c?`<b class="cnt">${c}</b>`:''}</button>`; }).join('');
  $('tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>setLayout(LAYOUTS.find(l=>l.k===b.dataset.k), true));
}
function setLayout(L, fit){ S.lay=L; renderTabs(); if (fit) fitView(); else draw(); }
function fitView(){
  if (S.mode==='3d'){ V3.fit(); return; }
  const r = vp.getBoundingClientRect(), b = S.lay.bbox, pad = 70;
  const w = b.x2-b.x1, h = b.y2-b.y1;
  const s = Math.min((r.width-2*pad)/w, (r.height-2*pad)/h);
  S.view.s = s; S.view.ox = r.width/2 - (b.x1+w/2)*s; S.view.oy = r.height/2 + (b.y1+h/2)*s;
  draw();
}

/* ---------- drawing ---------- */
let DPR = 1, raf = 0;
function resize(){
  const r = vp.getBoundingClientRect(); DPR = window.devicePixelRatio||1;
  cv.width = Math.max(1,Math.round(r.width*DPR)); cv.height = Math.max(1,Math.round(r.height*DPR));
  draw();
}
const sx = X => S.view.ox + X*S.view.s, sy = Y => S.view.oy - Y*S.view.s;
const wx = px => (px - S.view.ox)/S.view.s, wy = py => (S.view.oy - py)/S.view.s;

function label(x,y,text,col,bg,align,base,size){
  ctx.font = `600 ${size||12}px "JetBrains Mono",ui-monospace,monospace`;
  const m = ctx.measureText(text), w = m.width+8, h=(size||12)+6;
  let bx = align==='center'? x-w/2 : align==='right'? x-w : x;
  let by = base==='middle'? y-h/2 : base==='bottom'? y-h : y;
  ctx.fillStyle = bg; ctx.fillRect(bx,by,w,h);
  ctx.fillStyle = col; ctx.textAlign='left'; ctx.textBaseline='middle'; ctx.fillText(text,bx+4,by+h/2+.5);
  return {bx,by,w,h};
}

function draw(){
  cancelAnimationFrame(raf);
  if (S.mode==='3d'){ V3.sync(); return; }
  const Wd = cv.width/DPR, Hd = cv.height/DPR, L = S.lay, v = S.view;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.fillStyle = C.canvas; ctx.fillRect(0,0,Wd,Hd);
  const b = L.bbox, ext = 4000;
  const gx1 = Math.min(b.x1, ...L.gW.map(g=>toX(g[1])))-ext, gx2 = Math.max(b.x2, ...L.gW.map(g=>toX(g[1])))+ext;
  const gy1 = Math.min(b.y1, ...L.gN.map(g=>toY(g[1])))-ext, gy2 = Math.max(b.y2, ...L.gN.map(g=>toY(g[1])))+ext;

  // highlighted grids for active point
  const p = S.pts[S.act];
  let hiN=null, hiW=null;
  if (p && p.lay===L){ hiN = gridInfo(p.N,L.gN,'N').best; hiW = gridInfo(p.W,L.gW,'W').best; }

  // grid lines
  ctx.save(); ctx.lineWidth=1; ctx.setLineDash([14,4,3,4]);
  for (const [n,g] of L.gN){ const y=sy(toY(g)); ctx.strokeStyle=C.grid; ctx.globalAlpha = (hiN&&hiN.n===n)?1:.55; ctx.lineWidth=(hiN&&hiN.n===n)?2:1; ctx.beginPath(); ctx.moveTo(sx(gx1),y); ctx.lineTo(sx(gx2),y); ctx.stroke(); }
  for (const [n,g] of L.gW){ const x=sx(toX(g)); ctx.strokeStyle=C.grid; ctx.globalAlpha = (hiW&&hiW.n===n)?1:.55; ctx.lineWidth=(hiW&&hiW.n===n)?2:1; ctx.beginPath(); ctx.moveTo(x,sy(gy2)); ctx.lineTo(x,sy(gy1)); ctx.stroke(); }
  ctx.restore();

  // steel (world transform)
  ctx.save();
  ctx.setTransform(DPR*v.s,0,0,-DPR*v.s,DPR*v.ox,DPR*v.oy);
  const px = 1/v.s;
  const sty = {'STEEL-SEC':[C.steel2,.7],'COLUMN':[C.col,1],'STEEL':[C.steel,1.3],'CL':[C.cl,.8]};
  for (const ly of LAYERS){
    const path = L.paths[ly]; if (!path || !S.show[ly]) continue;
    ctx.strokeStyle = sty[ly][0]; ctx.lineWidth = sty[ly][1]*px;
    ctx.setLineDash(ly==='CL' ? [10*px,3*px,2*px,3*px] : []);
    ctx.stroke(path);
  }
  ctx.restore(); ctx.setTransform(DPR,0,0,DPR,0,0);

  // grid bubbles + dimensions, pinned inside viewport edges
  const bubR = 13;
  const topY = Math.max(bubR+4, Math.min(Hd-bubR-4, sy(gy2)));
  const leftX = Math.max(bubR+4, Math.min(Wd-bubR-4, sx(gx1)));
  const dimY = topY + bubR + 16, dimX = leftX + bubR + 18;
  ctx.font = '600 11px "JetBrains Mono",ui-monospace,monospace';
  // dims W (horizontal chain along top)
  const ws = L.gW.map(g=>[g[0],toX(g[1])]).sort((a,b)=>a[1]-b[1]);
  ctx.strokeStyle=C.dim; ctx.fillStyle=C.dim; ctx.lineWidth=1;
  for (let i=0;i<ws.length-1;i++){
    const xa=sx(ws[i][1]), xb=sx(ws[i+1][1]);
    ctx.beginPath(); ctx.moveTo(xa,dimY); ctx.lineTo(xb,dimY); ctx.moveTo(xa,dimY-4); ctx.lineTo(xa,dimY+4); ctx.moveTo(xb,dimY-4); ctx.lineTo(xb,dimY+4); ctx.stroke();
    if (xb-xa>40){ ctx.textAlign='center'; ctx.textBaseline='bottom'; ctx.fillText(fmt(ws[i+1][1]-ws[i][1]),(xa+xb)/2,dimY-3); }
  }
  const ns = L.gN.map(g=>[g[0],toY(g[1])]).sort((a,b)=>a[1]-b[1]);
  for (let i=0;i<ns.length-1;i++){
    const ya=sy(ns[i][1]), yb=sy(ns[i+1][1]);
    ctx.beginPath(); ctx.moveTo(dimX,ya); ctx.lineTo(dimX,yb); ctx.moveTo(dimX-4,ya); ctx.lineTo(dimX+4,ya); ctx.moveTo(dimX-4,yb); ctx.lineTo(dimX+4,yb); ctx.stroke();
    if (ya-yb>26){ ctx.save(); ctx.translate(dimX+4,(ya+yb)/2); ctx.rotate(-Math.PI/2); ctx.textAlign='center'; ctx.textBaseline='top'; ctx.fillText(fmt(ns[i+1][1]-ns[i][1]),0,0); ctx.restore(); }
  }
  const bubble = (x,y,t,hi)=>{
    ctx.beginPath(); ctx.arc(x,y,bubR,0,7); ctx.fillStyle = hi? C.grid : C.panel; ctx.fill();
    ctx.lineWidth=1.5; ctx.strokeStyle=C.grid; ctx.stroke();
    ctx.fillStyle = hi? '#fff' : C.gridtxt; ctx.font = `700 ${t.length>2?10:12}px "Barlow Condensed",sans-serif`;
    ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(t,x,y+.5);
  };
  for (const [n,X] of ws){ const x=sx(X); if (x>-20&&x<Wd+20) bubble(x,topY,n,hiW&&hiW.n===n); }
  for (const [n,Y] of ns){ const y=sy(Y); if (y>-20&&y<Hd+20) bubble(leftX,y,n,hiN&&hiN.n===n); }

  // north arrow
  ctx.save(); ctx.translate(Wd-80, Hd-36); ctx.fillStyle=C.ink; ctx.beginPath(); ctx.moveTo(0,-18); ctx.lineTo(7,4); ctx.lineTo(0,0); ctx.lineTo(-7,4); ctx.closePath(); ctx.fill();
  ctx.font='700 12px "Barlow Condensed",sans-serif'; ctx.textAlign='center'; ctx.fillText('PN',0,18); ctx.restore();
  // scale bar
  { const nice=[500,1000,2000,5000,10000,20000]; let m=nice[0]; for (const n of nice) if (n*v.s<130) m=n;
    const x0=Wd-130-m*v.s, y0=Hd-22; ctx.strokeStyle=C.ink; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(x0,y0); ctx.lineTo(x0+m*v.s,y0); ctx.stroke();
    ctx.fillStyle=C.ink; ctx.font='11px "JetBrains Mono",monospace'; ctx.textAlign='center'; ctx.textBaseline='bottom'; ctx.fillText((m/1000)+' m', x0+m*v.s/2, y0-3); }

  drawMulti(Wd,Hd);
  // inactive points
  S.pts.forEach((q,i)=>{ if (i===S.act) return; const x=sx(toX(q.W)), y=sy(toY(q.N));
    ctx.beginPath(); ctx.arc(x,y,6,0,7); ctx.fillStyle=C.pt2; ctx.fill(); ctx.lineWidth=2; ctx.strokeStyle='#fff'; ctx.stroke();
    if (q.name) label(x+9,y,q.name.slice(0,28),C.pt2,C.panel,'left','middle',11);
  });

  if (p && p.lay===L) drawActive(p, hiN, hiW, Wd, Hd);
}

function drawMulti(Wd,Hd){
  const L = S.lay, list = S.multi.filter(q=>q.lay===L);
  if (!list.length) return;
  const placed = [];
  const marks = list.map(q=>({q, x:sx(toX(q.W)), y:sy(toY(q.N))}));
  for (const m of marks){ placed.push({bx:m.x-8,by:m.y-8,w:16,h:16}); }
  const hit = r => placed.some(o=> r.bx<o.bx+o.w && r.bx+r.w>o.bx && r.by<o.by+o.h && r.by+r.h>o.by);
  // markers
  for (const m of marks){
    const sel = S.multi.indexOf(m.q)===S.mSel;
    if (sel){ ctx.beginPath(); ctx.arc(m.x,m.y,13,0,7); ctx.fillStyle='rgba(255,77,0,.25)'; ctx.fill(); }
    ctx.beginPath(); ctx.arc(m.x,m.y,6.5,0,7); ctx.fillStyle = sel?C.hot:C.pt2; ctx.fill(); ctx.lineWidth=2; ctx.strokeStyle='#fff'; ctx.stroke();
  }
  // labels (greedy placement, close to marker)
  for (const m of marks){
    const sel = S.multi.indexOf(m.q)===S.mSel;
    const l1 = m.q.short, l2 = `${m.q.gn.n}: ${fmt(Math.abs(m.q.gn.d))}  ${m.q.gw.n}: ${fmt(Math.abs(m.q.gw.d))}`;
    ctx.font='700 12px "JetBrains Mono",ui-monospace,monospace'; const w1=ctx.measureText(l1).width;
    ctx.font='600 10.5px "JetBrains Mono",ui-monospace,monospace'; const w2=ctx.measureText(l2).width;
    const w=Math.max(w1,w2)+10, h=30, g=9;
    const cands=[[m.x+g,m.y-h/2],[m.x-g-w,m.y-h/2],[m.x-w/2,m.y-g-h],[m.x-w/2,m.y+g],[m.x+g,m.y-h-2],[m.x+g,m.y+2],[m.x-g-w,m.y-h-2],[m.x-g-w,m.y+2]];
    let pick=null;
    for (const [bx,by] of cands){ const r={bx,by,w,h}; if(!hit(r)){ pick=r; break; } }
    if (!pick){ for (let k=1;k<5&&!pick;k++) for (const [bx,by] of cands){ const r={bx:bx+(bx>m.x?k*14:-k*14),by:by+(by>m.y?k*14:-k*14),w,h}; if(!hit(r)){ pick=r; break; } } }
    if (!pick) pick={bx:cands[0][0],by:cands[0][1],w,h};
    placed.push(pick);
    const cx=Math.max(pick.bx,Math.min(m.x,pick.bx+w)), cy=Math.max(pick.by,Math.min(m.y,pick.by+h));
    if (Math.hypot(cx-m.x,cy-m.y)>10){ ctx.strokeStyle=sel?C.hot:C.pt2; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(m.x,m.y); ctx.lineTo(cx,cy); ctx.stroke(); }
    ctx.fillStyle=C.panel; ctx.fillRect(pick.bx,pick.by,w,h);
    ctx.strokeStyle=sel?C.hot:C.pt2; ctx.lineWidth=1.5; ctx.strokeRect(pick.bx+.5,pick.by+.5,w-1,h-1);
    ctx.textAlign='left'; ctx.textBaseline='middle';
    ctx.font='700 12px "JetBrains Mono",ui-monospace,monospace'; ctx.fillStyle=sel?C.hot:C.pt2; ctx.fillText(l1,pick.bx+5,pick.by+9);
    ctx.font='600 10.5px "JetBrains Mono",ui-monospace,monospace'; ctx.fillStyle=C.ink; ctx.fillText(l2,pick.bx+5,pick.by+22);
  }
}

function drawActive(p, hiN, hiW, Wd, Hd){
  const x = sx(toX(p.W)), y = sy(toY(p.N));
  // crosshair
  ctx.save(); ctx.strokeStyle=C.hot; ctx.globalAlpha=.35; ctx.lineWidth=1; ctx.setLineDash([2,4]);
  ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(Wd,y); ctx.moveTo(x,0); ctx.lineTo(x,Hd); ctx.stroke(); ctx.restore();
  // leaders to nearest grids
  ctx.save(); ctx.strokeStyle=C.lead; ctx.lineWidth=2; ctx.setLineDash([6,4]);
  const yg = sy(toY(hiN.g)), xg = sx(toX(hiW.g));
  ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x,yg); ctx.moveTo(x,y); ctx.lineTo(xg,y); ctx.stroke();
  ctx.setLineDash([]); ctx.fillStyle=C.lead;
  for (const [ax,ay] of [[x,yg],[xg,y]]){ ctx.beginPath(); ctx.arc(ax,ay,3.5,0,7); ctx.fill(); }
  ctx.restore();
  const txtN = `${hiN.n}: ${fmt(Math.abs(hiN.d))}`, txtW = `${hiW.n}: ${fmt(Math.abs(hiW.d))}`;
  label(x+6, (y+yg)/2, txtN, '#fff', C.lead, 'left', 'middle', 13);
  if (Math.abs(xg-x)<70) label(xg>=x ? x+18 : x-18, y-3, txtW, '#fff', C.lead, xg>=x?'left':'right', 'bottom', 13);
  else label((x+xg)/2, y+(yg>y? -6 : 6), txtW, '#fff', C.lead, 'center', yg>y?'bottom':'top', 13);
  // pulsing dot
  const t = (performance.now()%1400)/1400;

function shortName(n){ const m=n.match(/-(\d{4})$/); return m?m[1]:n; }
function runMulti(text, silent){
  const toks = text.split(/[\s,;]+/).map(t=>t.trim().replace(/^\//,'')).filter(Boolean);
  const seen = new Set(), out=[], miss=[];
  for (const t of toks){
    const r = findSups(t);
    if (!r.length){ miss.push(t); continue; }
    for (const s of r){ if (seen.has(s[0])) continue; seen.add(s[0]);
      const q={name:s[0], W:s[3], N:s[2], U:s[4]}; q.lay=pickLayout(q.W,q.N,q.U);
      q.gn=gridInfo(q.N,q.lay.gN,'N').best; q.gw=gridInfo(q.W,q.lay.gW,'W').best; out.push(q); }
  }
  // short label: last 4 digits, add module if duplicated
  const cnt={}; out.forEach(q=>{ const k=shortName(q.name); cnt[k]=(cnt[k]||0)+1; });
  out.forEach(q=>{ const k=shortName(q.name); q.short = cnt[k]>1 ? (q.name.split('-')[1]||'')+'-'+k : k; });
  out.sort((a,b)=> LAYOUTS.indexOf(a.lay)-LAYOUTS.indexOf(b.lay) || a.name.localeCompare(b.name));
  S.multi=out; S.mMiss=miss; S.mSel=-1;
  renderMulti(); saveHash();
  if (!out.length){ renderTabs(); draw(); if(!silent) toast('Không tìm thấy support nào'); return; }
  const by={}; out.forEach(q=>by[q.lay.k]=(by[q.lay.k]||0)+1);
  const best = LAYOUTS.reduce((a,l)=> (by[l.k]||0)>(by[a.k]||0)?l:a, LAYOUTS[0]);
  S.lay=best; renderTabs(); fitMulti();
  if (isMobile() && document.activeElement && document.activeElement.blur) document.activeElement.blur();
}
function fitMulti(){
  if (S.mode==='3d'){ V3.fitMulti(); return; }
  const list=S.multi.filter(q=>q.lay===S.lay); if(!list.length){ fitView(); return; }
  let x1=Infinity,y1=Infinity,x2=-Infinity,y2=-Infinity;
  for(const q of list){ const X=toX(q.W),Y=toY(q.N); x1=Math.min(x1,X);x2=Math.max(x2,X);y1=Math.min(y1,Y);y2=Math.max(y2,Y); }
  const span=Math.max(x2-x1,y2-y1,12000), r=vp.getBoundingClientRect(), pad=Math.min(90, r.width*.12, r.height*.12);
  const s=Math.min((r.width-2*pad)/Math.max(x2-x1,span*.5), (r.height-2*pad)/Math.max(y2-y1,span*.5));
  S.view.s=s; S.view.ox=r.width/2-(x1+x2)/2*s; S.view.oy=r.height/2+(y1+y2)/2*s; draw();
}

/* hash: #p=name|W|N|U;... */
function saveHash(){
  try{
    const h = S.pts.map(p=>[encodeURIComponent(p.name||''),Math.round(p.W),Math.round(p.N),p.U==null?'':Math.round(p.U)].join('|')).join(';');
    const m = S.multi.length ? 'm='+S.multi.map(q=>encodeURIComponent(q.name)).join(',') : '';
    const parts = [h?'p='+h:'', m].filter(Boolean).join('&');
    history.replaceState(null,'', parts ? '#'+parts : location.pathname+location.search);
  }catch(e){}
}
function loadHash(){
  const mm = location.hash.match(/m=([^&]*)/); if (mm) S.hashMulti = mm[1].split(',').map(decodeURIComponent).join('\n');
  const m = location.hash.match(/p=([^&]*)/); if (!m) return false;
  for (const s of m[1].split(';')){ const [n,W,N,U]=s.split('|'); if (W==null||N==null) continue;
    const p={name:decodeURIComponent(n||''),W:+W,N:+N,U:U===''||U==null?null:+U}; p.lay=pickLayout(p.W,p.N,p.U); S.pts.push(p); }
  if (!S.pts.length) return false;
  S.pts=[S.pts[S.pts.length-1]]; S.act = 0; return true;
}

  function upload(c){

  function clipBox(){
    const b=st.band, o=st.org;
    let mn=[-BIG,-BIG,(b.z1!=null?b.z1:-BIG)-o[2]], mx=[BIG,BIG,(b.z2!=null?b.z2:BIG)-o[2]];

  }
  function size(){
    const r=vp.getBoundingClientRect(), d=window.devicePixelRatio||1;

    if (gl3.width!==w||gl3.height!==h){ gl3.width=w; gl3.height=h; ov.width=w; ov.height=h; st.dirty=true; }
  }
  function render(pick){
    const gl=st.gl; if(!gl) return null;

    gl.viewport(0,0,gl3.width,gl3.height);
    if (pick){ gl.clearColor(0,0,0,0); } else { const c=hex(C.canvas); gl.clearColor(c[0],c[1],c[2],1); }

        gl.uniform3fv(st.U.uBmin,[-BIG,-BIG,-BIG]); gl.uniform3fv(st.U.uBmax,[BIG,BIG,BIG]);
        for (const i of fs) gl.drawElements(gl.TRIANGLES,c.oCnt[i],gl.UNSIGNED_INT,c.oStart[i]*4);

    // 1) vật thể đặc; 2) Structure mờ vẽ sau cùng, không ghi depth (khi chọn bằng chuột thì bỏ qua Structure mờ)
    gl.disable(gl.BLEND); gl.depthMask(true); gl.uniform1f(st.U.uAlpha,1.0);

      gl.depthMask(true); gl.disable(gl.BLEND);
      // vẽ lại ống/support đang tìm lên trên lớp Structure mờ (Structure mờ không ghi depth nên LEQUAL đi qua đúng chỗ của nó)

      gl.uniform3fv(st.U.uBmin,[-BIG,-BIG,-BIG]); gl.uniform3fv(st.U.uBmax,[BIG,BIG,BIG]);
      DISC.forEach((d,ci)=>{ const c=st.ch[d.k], fs=st.focusSet[d.k]; if(!FOCUS_ONLY[d.k]||!c||!c.vao||!fs||!fs.length) return;
        gl.uniform3fv(st.U.uCol,d.col); gl.uniform1ui(st.U.uChunk,ci+1); gl.uniform1ui(st.U.uSel,(st.sel&&st.sel.k===d.k)?st.sel.i:0xFFFFFFFF);

  const hex = s=>{ const m=/^#?([0-9a-f]{6})$/i.exec((s||'').trim()); if(!m) return [0.97,0.98,0.99]; const n=parseInt(m[1],16); return [(n>>16&255)/255,(n>>8&255)/255,(n&255)/255]; };

  function pickAt(px,py){
    const gl=st.gl; if(!gl) return null;
    const d=window.devicePixelRatio||1, w=gl3.width, h=gl3.height;
    const fb=gl.createFramebuffer(), tx=gl.createTexture(), rb=gl.createRenderbuffer();
    gl.bindTexture(gl.TEXTURE_2D,tx); gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA8,w,h,0,gl.RGBA,gl.UNSIGNED_BYTE,null);
    gl.bindRenderbuffer(gl.RENDERBUFFER,rb); gl.renderbufferStorage(gl.RENDERBUFFER,gl.DEPTH_COMPONENT24,w,h);
    gl.bindFramebuffer(gl.FRAMEBUFFER,fb);
    gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,tx,0);
    gl.framebufferRenderbuffer(gl.FRAMEBUFFER,gl.DEPTH_ATTACHMENT,gl.RENDERBUFFER,rb);
    const rx=Math.round(px*d), ry=Math.round(h-py*d);
    const read=mode=>{ gl.disable(gl.BLEND); render(mode); const b=new Uint8Array(4); gl.readPixels(rx,ry,1,1,gl.RGBA,gl.UNSIGNED_BYTE,b); return b; };
    const px2=read(1);
    gl.bindFramebuffer(gl.FRAMEBUFFER,null); gl.deleteFramebuffer(fb); gl.deleteTexture(tx); gl.deleteRenderbuffer(rb);

    if (!px2[3]) return null;

    return d0 && st.ch[d0.k] && st.ch[d0.k].meta ? {k:d0.k, i:id} : null;
  }

  /* ---------- tải dữ liệu ---------- */
  function showMsg(h){ msg.innerHTML=h; msg.hidden=!h; }
  async function getFile(name){
    if (st.files){ const f=st.files.get(name); if(!f) throw new Error('Thiếu file '+name+' trong thư mục đã chọn'); return await f.arrayBuffer(); }
    const r=await fetch('3d/'+name,{cache:'no-cache'}); if(!r.ok) throw new Error('HTTP '+r.status+' khi tải 3d/'+name); return await r.arrayBuffer();
  }
  async function ensureIndex(){
    if (st.idx) return st.idx;
    const ab=await getFile('index.json');
    const idx=JSON.parse(new TextDecoder().decode(ab));
    st.org=idx.origin; st.q=idx.q||2;
    if (idx.enc){
      if (!PW) throw new Error('Thiếu mật khẩu để giải mã dữ liệu 3D');
      const salt=b64(idx.enc.salt);
      const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(PW),'PBKDF2',false,['deriveKey']);
      st.key=await crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:idx.enc.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
    }
    st.idx=idx; return idx;
  }
  const b64 = s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
  async function loadChunk(k){
    const c=st.ch[k]||(st.ch[k]={k,status:'wait'});
    if (c.status==='ok'||c.status==='loading') return;
    const idx=await ensureIndex();
    const info=idx.chunks.find(x=>x.d===k); if(!info){ c.status='none'; legend(); return; }
    c.status='loading'; legend();
    try{
      let ab=await getFile(info.f);
      if (st.key){ const u=new Uint8Array(ab); ab=await crypto.subtle.decrypt({name:'AES-GCM',iv:u.slice(0,12)},st.key,u.slice(12)); }
      ab=await new Response(new Blob([ab]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer();
      parse(c,ab); upload(c); c.status='ok'; c.info=info;
      updateFocusSet();
      { const p=S.pts[S.act]; if (p&&p.name&&!st.sel) selectByName(p.name); }
      if (!st.inited){ st.inited=true; afterFirst(); }
      st.dirty=true; legend(); loop();
    }catch(e){ c.status='err'; c.err=(e&&e.name==='OperationError')?'Sai mật khẩu / dữ liệu 3D không khớp':(e.message||String(e)); legend(); }
  }
  function parse(c,ab){
    const dv=new DataView(ab);
    if (String.fromCharCode(dv.getUint8(0),dv.getUint8(1),dv.getUint8(2),dv.getUint8(3))!=='CGF3') throw new Error('Sai định dạng khối 3D');
    const ml=dv.getUint32(8,true), meta=JSON.parse(new TextDecoder().decode(new Uint8Array(ab,12,ml)));
    const a4=x=>(x+3)&~3;
    let off=a4(12+ml);
    const n=meta.name.length; let tv=0, ti=0;
    for(let i=0;i<n;i++){ tv+=meta.nv[i]; ti+=meta.nt[i]*3; }
    c.pos=new Int16Array(ab,off,tv*3); off=a4(off+tv*6);
    c.idx=new Uint32Array(ti); c.ids=new Uint32Array(tv);
    let vb=0, ib=0;
    c.oStart=new Uint32Array(n); c.oCnt=new Uint32Array(n);
    for(let i=0;i<n;i++){
      const k3=meta.nt[i]*3; let src;
      c.oStart[i]=ib; c.oCnt[i]=k3;
      if (meta.wide[i]){ src=new Uint32Array(ab,off,k3); off+=k3*4; } else { src=new Uint16Array(ab,off,k3); off=a4(off+k3*2); }

      c.ids.fill(i,vb,vb+meta.nv[i]); vb+=meta.nv[i]; ib+=k3;
    }
    c.meta=meta; c.tris=ti/3;
    c.map=new Map(); c.norm=meta.name.map(nrm);
    for(let i=0;i<n;i++) if(!c.map.has(c.norm[i])) c.map.set(c.norm[i],i);
    const bb=meta.bb; let b=st.sceneBox||[Infinity,Infinity,Infinity,-Infinity,-Infinity,-Infinity];
    for(let i=0;i<n;i++) for(let j=0;j<3;j++){ b[j]=Math.min(b[j],bb[i*6+j]); b[3+j]=Math.max(b[3+j],bb[i*6+3+j]); }

  }
  // X luôn tải (nhỏ, cần cho tìm support); P chỉ tải khi bật "tất cả" hoặc khi tìm một spool/line
  function loadAll(){ (async()=>{ for(const k of LOAD_ORDER) if(st.show[k]||k==='X') await loadChunk(k).catch(e=>fail(e)); updateFocusSet(); })(); }

  /* ---------- đối tượng đang tìm ---------- */
  function nrm(s){ return String(s||'').replace(/^\//,'').replace(/"/g,'').trim().toUpperCase(); }
  function resolve(name){
    const q=nrm(name); if(!q) return [];
    const out=[];
    for (const k of ['X','P','M','S']){ const c=st.ch[k]; if(c&&c.map&&c.map.has(q)) out.push({k,i:c.map.get(q)}); }
    if (out.length) return out;
    const c=st.ch.P; if(!c||!c.norm) return out;
    const q2=q.replace(/-SD-\d+(_\d+)?$/,'');            // tên spool ISO: <line>-SD-NNNN_RR
    if (c.map.has(q2)) return [{k:'P',i:c.map.get(q2)}];
    let best=-1, bl=0;                                       // line dài nhất là tiền tố của tên tìm (hoặc ngược lại)
    c.norm.forEach((n,i)=>{ if (n.length>bl && (q2.startsWith(n+'-') || (q2.length>=8 && n.startsWith(q2)))){ best=i; bl=n.length; } });
    return best>=0 ? [{k:'P',i:best}] : out;
  }
  function updateFocusSet(){
    const names=[]; const p=S.pts[S.act]; if(p&&p.name) names.push(p.name);
    for (const q of S.multi) names.push(q.name);
    const fs={P:new Set(), X:new Set()}; let needP=false;
    for (const nm of names){
      const h=resolve(nm);
      for (const x of h) if (fs[x.k]) fs[x.k].add(x.i);
      if (!h.length) needP=true;
    }
    st.focusSet={P:[...fs.P], X:[...fs.X]};
    const cp=st.ch.P;
    if (needP && st.idx && (!cp || cp.status==='wait')) loadChunk('P').catch(fail);
    st.dirty=true; if (S.mode==='3d') legend();
  }
  function fail(e){
    const local = location.protocol==='file:';
    showMsg(`<b>Không tải được dữ liệu 3D.</b><br>${esc(e.message||String(e))}<br>`+
      (local?'Trang đang mở trực tiếp từ file, trình duyệt chặn đọc thư mục <code>3d/</code>. ':'')+
      `<button class="btn" id="b3pick">Chọn thư mục 3d…</button><input type="file" id="i3pick" webkitdirectory multiple hidden>`);
    $('b3pick').onclick=()=>$('i3pick').click();
    $('i3pick').onchange=e=>{ st.files=new Map([...e.target.files].map(f=>[f.name,f])); st.idx=null; for(const k in st.ch) if(st.ch[k].status==='err') st.ch[k].status='wait'; showMsg(''); loadAll(); };
  }

  /* ---------- camera ---------- */
  function afterFirst(){ const p=S.pts[S.act]; if (p) focus(p); else fit(); }
  function visBox(){
    let b=null;
    for (const d of DISC){ const c=st.ch[d.k]; if(!c||!c.meta||!st.show[d.k]) continue;
      const bb=c.meta.bb, n=c.meta.name.length, [mn,mx]=clipBox();
      for(let i=0;i<n;i++){ const o=i*6;
        const x1=bb[o]-st.org[0], y1=bb[o+1]-st.org[1], z1=bb[o+2]-st.org[2], x2=bb[o+3]-st.org[0], y2=bb[o+4]-st.org[1], z2=bb[o+5]-st.org[2];
        if (x2<mn[0]||x1>mx[0]||y2<mn[1]||y1>mx[1]||z2<mn[2]||z1>mx[2]) continue;
        if(!b) b=[x1,y1,z1,x2,y2,z2]; else { b[0]=Math.min(b[0],x1); b[1]=Math.min(b[1],y1); b[2]=Math.min(b[2],z1); b[3]=Math.max(b[3],x2); b[4]=Math.max(b[4],y2); b[5]=Math.max(b[5],z2); }
      }
    }
    if (b){ const [mn,mx]=clipBox(); b[0]=Math.max(b[0],mn[0]); b[1]=Math.max(b[1],mn[1]); b[2]=Math.max(b[2],mn[2]); b[3]=Math.min(b[3],mx[0]); b[4]=Math.min(b[4],mx[1]); b[5]=Math.min(b[5],mx[2]); }
    return b;
  }
  function fitBox(b){
    if(!b) return;
    st.cam.t=[(b[0]+b[3])/2,(b[1]+b[4])/2,(b[2]+b[5])/2];
    const r=Math.hypot(b[3]-b[0],b[4]-b[1],b[5]-b[2])/2;
    const asp=(gl3.clientWidth||1)/(gl3.clientHeight||1), f=Math.min(st.fov, 2*Math.atan(Math.tan(st.fov/2)*asp));
    st.cam.dist=Math.max(3000, r/Math.sin(f/2)*1.05);

  }
  function fit(){ fitBox(visBox()); }
  function setBandFor(lay){ const k=LAY2BAND[lay&&lay.k]; if(k){ st.band=BANDS.find(b=>b.k===k); renderTabs3(); } }
  function focus(p){
    if (!st.gl) return;
    setBandFor(p.lay);
    // cao độ điểm nằm ngoài dải sàn đang lọc (vd. ống trên CD nhưng EL 25419) -> chuyển sang dải chứa điểm, để vật thể không bị cắt mất

    st.cam.t=loc(p.W,p.N,p.U!=null&&!isNaN(p.U)?p.U:(p.lay?p.lay.tos:0));
    st.cam.dist=14000; st.pick=null;
    st.lastNm=p.name||''; updateFocusSet(); selectByName(p.name);
    st.dirty=true; loop();
  }
  function fitMulti(){
    updateFocusSet();
    const list=S.multi.filter(q=>q.lay===S.lay); if(!list.length){ fit(); return; }
    setBandFor(S.lay);
    let b=null; for(const q of list){ const p=loc(q.W,q.N,q.U!=null?q.U:q.lay.tos); if(!b) b=[...p,...p]; else { for(let j=0;j<3;j++){ b[j]=Math.min(b[j],p[j]); b[3+j]=Math.max(b[3+j],p[j]); } } }
    b[0]-=3000; b[1]-=3000; b[2]-=1500; b[3]+=3000; b[4]+=3000; b[5]+=1500; fitBox(b);
  }
  function selectByName(nm){
    st.sel=null; if(!nm) return;
    const h=resolve(nm); if(h.length) st.sel=h[0];
  }
  function zoom(f){ st.cam.dist=Math.max(500,Math.min(600000,st.cam.dist/f)); st.dirty=true; loop(); }
  function topView(){ st.cam.pitch=Math.PI/2-0.001; st.cam.yaw=-Math.PI/2; st.dirty=true; loop(); }
  // nút Pan / Orbit: chọn kiểu kéo 1 ngón / chuột trái
  function setDrag(m){ st.drag=m; $('zPan').classList.toggle('on',m==='pan'); $('zRot').classList.toggle('on',m==='rot');
    $('zPan').setAttribute('aria-pressed',m==='pan'); $('zRot').setAttribute('aria-pressed',m==='rot'); }

  /* ---------- tương tác ---------- */
  const ptr=new Map(); let g=null, moved=false, lastTap=0;
  gl3.addEventListener('contextmenu',e=>e.preventDefault());
  gl3.addEventListener('pointerdown',e=>{
    e.stopPropagation(); try{ gl3.setPointerCapture(e.pointerId); }catch(_){} ptr.set(e.pointerId,{x:e.clientX,y:e.clientY}); moved=false;
    const alt = e.button===2||e.button===1||e.shiftKey||e.ctrlKey; // chuột phải/giữa/Shift: kiểu kéo ngược lại
    const pan = (st.drag==='pan') !== alt;
    if (ptr.size===1) g={mode:pan?'pan':'rot',x:e.clientX,y:e.clientY,yaw:st.cam.yaw,pitch:st.cam.pitch,t:st.cam.t.slice()};
    if (ptr.size===2){ const [a,b]=[...ptr.values()]; g={mode:'pinch',d:Math.hypot(a.x-b.x,a.y-b.y),dist:st.cam.dist,mx:(a.x+b.x)/2,my:(a.y+b.y)/2,t:st.cam.t.slice()}; }
  });
  gl3.addEventListener('pointermove',e=>{
    e.stopPropagation(); if(!ptr.has(e.pointerId)||!g) return;
    ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});
    const H=gl3.clientHeight||1, k=2*Math.tan(st.fov/2)/H;
    if (g.mode==='pinch' && ptr.size===2){
      const [a,b]=[...ptr.values()], d=Math.hypot(a.x-b.x,a.y-b.y);
      st.cam.dist=Math.max(500,g.dist*g.d/Math.max(d,1));
      const bs=basis(), dx=(a.x+b.x)/2-g.mx, dy=(a.y+b.y)/2-g.my;
      st.cam.t=add3(g.t, add3(mul3(bs.r,-dx*k*st.cam.dist), mul3(bs.u,dy*k*st.cam.dist)));
      moved=true;
    } else if (ptr.size===1){
      const dx=e.clientX-g.x, dy=e.clientY-g.y; if (Math.abs(dx)+Math.abs(dy)>4) moved=true; if(!moved) return;
      if (g.mode==='rot'){ st.cam.yaw=g.yaw-dx*0.006; st.cam.pitch=Math.max(-1.55,Math.min(1.55,g.pitch+dy*0.006)); }
      else { const bs=basis(); st.cam.t=add3(g.t, add3(mul3(bs.r,-dx*k*st.cam.dist), mul3(bs.u,dy*k*st.cam.dist))); }
    }
    st.dirty=true; loop();
  });
  const up=e=>{
    e.stopPropagation(); const was=ptr.has(e.pointerId); ptr.delete(e.pointerId);
    if (was && !moved && e.type==='pointerup' && ptr.size===0){
      const r=gl3.getBoundingClientRect(), x=e.clientX-r.left, y=e.clientY-r.top, now=performance.now();
      const h=pickAt(x,y);
      if (now-lastTap<350 && h){ const bb=st.ch[h.k].meta.bb, o=h.i*6; st.cam.t=[(bb[o]+bb[o+3])/2-st.org[0],(bb[o+1]+bb[o+4])/2-st.org[1],(bb[o+2]+bb[o+5])/2-st.org[2]]; }
      lastTap=now; st.sel=h; st.pick=pickPoint(h); info(h); st.dirty=true; loop();
    }
    if (ptr.size<2 && g && g.mode==='pinch') g=null;
    if (!ptr.size) g=null;
  };
  gl3.addEventListener('pointerup',up); gl3.addEventListener('pointercancel',up);
  gl3.addEventListener('wheel',e=>{
    e.preventDefault(); e.stopPropagation();
    const f=Math.exp(-e.deltaY*0.0015), r=gl3.getBoundingClientRect();
    const nx=(e.clientX-r.left)/r.width*2-1, ny=1-(e.clientY-r.top)/r.height*2;
    const bs=basis(), th=Math.tan(st.fov/2), asp=r.width/r.height;
    const dir=norm3(add3(bs.f, add3(mul3(bs.r,nx*th*asp), mul3(bs.u,ny*th))));
    const P=add3(bs.eye, mul3(dir,st.cam.dist));
    const d2=Math.max(500,Math.min(600000,st.cam.dist/f)), s=1-d2/st.cam.dist;
    st.cam.t=add3(st.cam.t, mul3(sub3(P,st.cam.t),s)); st.cam.dist=d2;
    st.dirty=true; loop();
  },{passive:false});

  // chạm vào vật thể: chỉ hiện thông tin item. Tọa độ lấy theo DỮ LIỆU (support PDF / spool_draft) của item đó,
  // KHÔNG lấy vị trí điểm chạm. Item không có trong dữ liệu -> không có tọa độ.
  function pickPoint(h){
    if(!h) return null;
    const nm=nrm(st.ch[h.k].meta.name[h.i]); if(!nm) return null;
    const seen=new Set(), rows=[];
    for (const s of SUPS){
      const n=nrm(s[0]);
      // support: trùng tên; ống (P): drawing/spool thuộc line đó (<line>-NNNN, <line>-SD-...)
      if (!(n===nm || (h.k==='P' && n.startsWith(nm+'-')))) continue;
      const W=+s[3], N=+s[2], U=(s[4]==null||s[4]===''||isNaN(+s[4]))?null:+s[4];
      if (isNaN(W)||isNaN(N)) continue;
      const key=W+'|'+N+'|'+U; if (seen.has(key)) continue; seen.add(key); // spool trùng tọa độ với drawing -> 1 dòng
      const L=pickLayout(W,N,U), eh=!!(L&&L.eh);
      const gn=gridInfo(N,(L&&L.gN)||(eh?EH_N:DECK_N),'N'), gw=gridInfo(W,(L&&L.gW)||(eh?EH_W:DECK_W),'W');
      rows.push({name:String(s[0]),draft:s[1]==='DRAFT',W,N,U,Ud:U!=null?U:(L?L.tos:0),gN:gn.best,gW:gw.best,sN:gn.side(gn.best.d),sW:gw.side(gw.best.d)});
    }
    rows.sort((a,b)=>a.name.localeCompare(b.name));
    return rows.length ? rows : null;
  }
  function info(h){
    const ro=$('readout'); ro.classList.remove('idle');
    if(!h) st.pick=null;
    if(!h){ ro.classList.add('idle'); ro.innerHTML='<span style="color:var(--muted)">Bấm vào đối tượng để xem tên · kéo để xoay (Orbit) hoặc di chuyển (Pan) theo nút bên phải · 2 ngón để thu phóng</span>'; return; }
    const m=st.ch[h.k].meta, o=h.i*6, bb=m.bb;
    const W1=W0-bb[o+3], W2=W0-bb[o], N1=bb[o+1]+N0, N2=bb[o+4]+N0;
    ro.innerHTML=`<b>${esc(m.name[h.i].replace(/^\//,''))}</b> <span style="color:var(--muted)">${esc(m.groups[m.g[h.i]])}</span><br>`+
      (st.pick ? `<div class="pk3">`+st.pick.map(k=>`<div title="${esc(k.sN)} ${esc(k.gN.n)} · ${esc(k.sW)} ${esc(k.gW.n)}">${esc(k.name)}${k.draft?' <small style="color:#B88A00">DRAFT</small>':''} · W ${fmt(k.W)} · N ${fmt(k.N)} · U ${k.U==null?'–':fmt(k.U)} · <b>${esc(k.gN.n)}</b>: ${fmt(Math.abs(k.gN.d))} · <b>${esc(k.gW.n)}</b>: ${fmt(Math.abs(k.gW.d))}</div>`).join('')+`</div>`
      : `<span style="color:var(--muted)">Không có tọa độ trong dữ liệu cho item này</span>`);
  }

  /* ---------- vẽ ---------- */
  function loop(){ if(!st.raf) st.raf=requestAnimationFrame(frame); }
  function frame(){
    st.raf=0; if (S.mode!=='3d' || !st.gl) return;
    const vpm = st.dirty ? render(false) : viewProj(); st.dirty=false;
    overlay(vpm);
    if (S.pts[S.act]) loop(); // nhấp nháy điểm đang chọn
  }
  function overlay(vpm){
    const d=window.devicePixelRatio||1, W=ov.width/d, H=ov.height/d;
    oc.setTransform(d,0,0,d,0,0); oc.clearRect(0,0,W,H);
    const lab=(x,y,t,col,bg,al)=>{ oc.font='600 12px "JetBrains Mono",ui-monospace,monospace'; const w=oc.measureText(t).width+8; const bx=al==='right'?x-w:x;
      oc.fillStyle=bg; oc.fillRect(bx,y-9,w,18); oc.fillStyle=col; oc.textAlign='left'; oc.textBaseline='middle'; oc.fillText(t,bx+4,y+.5); };
    // lưới trục từ bản vẽ PM, đặt ở cao độ TOS của sàn đang lọc
    if (st.showGrid){
      const b=st.band, eh=!!b.eh, tos=b.k==='ID'?26000:b.k==='CD'?18000:b.k==='SD'?13500:eh?31864:34000;
      const gN=eh?EH_N:DECK_N, gW=eh?EH_W:DECK_W, ns=gN.map(g=>g[1]), ws=gW.map(g=>g[1]);
      const n1=Math.min(...ns)-4000, n2=Math.max(...ns)+4000, w1=Math.min(...ws)-4000, w2=Math.max(...ws)+4000;
      oc.save(); oc.strokeStyle=C.grid; oc.globalAlpha=.8; oc.lineWidth=1; oc.setLineDash([12,4,3,4]);
      const line=(a,bb,t)=>{ const A=project(vpm,a), B=project(vpm,bb); if(!A||!B) return; oc.beginPath(); oc.moveTo(A[0],A[1]); oc.lineTo(B[0],B[1]); oc.stroke();
        oc.save(); oc.setLineDash([]); oc.globalAlpha=1; oc.beginPath(); oc.arc(A[0],A[1],10,0,7); oc.fillStyle=C.panel; oc.fill(); oc.stroke();
        oc.fillStyle=C.gridtxt; oc.font='700 11px "Barlow Condensed",sans-serif'; oc.textAlign='center'; oc.textBaseline='middle'; oc.fillText(t,A[0],A[1]+.5); oc.restore(); };
      for (const [n,N] of gN) line(loc(w2,N,tos),loc(w1,N,tos),n);
      for (const [n,Wg] of gW) line(loc(Wg,n1,tos),loc(Wg,n2,tos),n);
      oc.restore();
    }
    // đường kích thước từ điểm tới trục gần nhất (giống 2D): nằm ngang ở cao độ của điểm, nhãn "2: 2500"
    const lbls=[]; // nhãn vẽ sau cùng để nằm trên đường
    const dimTo=(W,N,U,gN,gW)=>{
      if(!gN||!gW) return;
      const P=project(vpm,loc(W,N,U)); if(!P) return;
      oc.save(); oc.strokeStyle=C.lead; oc.fillStyle=C.lead; oc.lineWidth=2;
      const mine=[]; let short=false;
      for (const [g,isN] of [[gN,1],[gW,0]]){
        const E=isN?[W,g.g,U]:[g.g,N,U], Q=project(vpm,loc(E[0],E[1],E[2])); if(!Q) continue;
        oc.setLineDash([6,4]); oc.beginPath(); oc.moveTo(P[0],P[1]); oc.lineTo(Q[0],Q[1]); oc.stroke(); oc.setLineDash([]);
        // đoạn trục ngắn tại cao độ điểm để thấy rõ trục
        const a=isN?loc(W-1500,g.g,U):loc(g.g,N-1500,U), b=isN?loc(W+1500,g.g,U):loc(g.g,N+1500,U), A=project(vpm,a), B=project(vpm,b);
        if(A&&B){ oc.save(); oc.strokeStyle=C.grid; oc.lineWidth=1.5; oc.beginPath(); oc.moveTo(A[0],A[1]); oc.lineTo(B[0],B[1]); oc.stroke(); oc.restore(); }
        oc.beginPath(); oc.arc(Q[0],Q[1],3.5,0,7); oc.fill();
        if (Math.hypot(Q[0]-P[0],Q[1]-P[1])<90) short=true;
        mine.push([(P[0]+Q[0])/2,(P[1]+Q[1])/2,`${g.n}: ${fmt(Math.abs(g.d))}`]);
      }
      oc.restore();
      // đường ngắn trên màn hình (đang xem xa) -> gộp 2 nhãn thành khung cạnh điểm, có đường dẫn
      if (short && mine.length===2){
        const bx=P[0]+16, by=P[1]-52; oc.save(); oc.strokeStyle=C.lead; oc.lineWidth=1; oc.beginPath(); oc.moveTo(P[0],P[1]); oc.lineTo(bx,by+34); oc.stroke(); oc.restore();
        mine[0][0]=mine[1][0]=null; mine[0][1]=by+8; mine[1][1]=by+27; mine[0][3]=mine[1][3]=bx;
      }
      lbls.push(...mine);
    };
    const lblDraw=()=>{ for(const [x0,y,t,left] of lbls){ oc.font='700 12px "JetBrains Mono",ui-monospace,monospace'; const w=oc.measureText(t).width+8, x=x0==null?left+w/2:x0;
      oc.fillStyle=C.lead; oc.fillRect(x-w/2,y-9,w,18); oc.fillStyle='#fff'; oc.textAlign='center'; oc.textBaseline='middle'; oc.fillText(t,x,y+.5); } lbls.length=0; };
    const mVis=S.multi.filter(q=>q.lay===S.lay||st.band.k==='ALL');
    for (const q of mVis){
      const sel=S.multi.indexOf(q)===S.mSel, U=q.U!=null&&!isNaN(q.U)?q.U:q.lay.tos;
      if (q.gn&&q.gw&&(sel||mVis.length<=12)) dimTo(q.W,q.N,U,q.gn,q.gw);
      const s=project(vpm,loc(q.W,q.N,U)); if(!s) continue;
      oc.beginPath(); oc.arc(s[0],s[1],6,0,7); oc.fillStyle=sel?C.hot:C.pt2; oc.fill(); oc.lineWidth=2; oc.strokeStyle='#fff'; oc.stroke();
      lab(s[0]+9,s[1],q.short,'#fff',sel?C.hot:C.pt2);
    }
    lblDraw();
    // item vừa chạm: tọa độ theo dữ liệu (support / spool_draft) + kích thước tới trục gần nhất
    if (st.pick){ const ks=st.pick.slice(0,6);
      for (const k of ks) dimTo(k.W,k.N,k.Ud,k.gN,k.gW);
      lblDraw();
      for (const k of ks){ const s=project(vpm,loc(k.W,k.N,k.Ud)); if(!s) continue;
        oc.beginPath(); oc.arc(s[0],s[1],6,0,7); oc.fillStyle=C.lead; oc.fill(); oc.lineWidth=2; oc.strokeStyle='#fff'; oc.stroke();
        if (ks.length>1) lab(s[0]+9,s[1]-14,k.name.slice(-9),'#fff',C.lead); } }
    const p=S.pts[S.act];
    if (p){
      const pU=p.U!=null&&!isNaN(p.U)?p.U:(p.lay?p.lay.tos:0);
      const eh=!!(p.lay&&p.lay.eh), pgN=(p.lay&&p.lay.gN)||(eh?EH_N:DECK_N), pgW=(p.lay&&p.lay.gW)||(eh?EH_W:DECK_W);
      if (!S.multi.some(q=>q.W===p.W&&q.N===p.N)) dimTo(p.W,p.N,pU,gridInfo(p.N,pgN,'N').best,gridInfo(p.W,pgW,'W').best);
      lblDraw();
      const s=project(vpm,loc(p.W,p.N,pU));
      if (s){
        const t=(performance.now()%1400)/1400;
        oc.beginPath(); oc.arc(s[0],s[1],10+22*t,0,7); oc.strokeStyle=C.hot; oc.globalAlpha=1-t; oc.lineWidth=3; oc.stroke(); oc.globalAlpha=1;
        oc.beginPath(); oc.arc(s[0],s[1],7,0,7); oc.fillStyle=C.hot; oc.fill(); oc.lineWidth=2.5; oc.strokeStyle='#fff'; oc.stroke();
        if (p.name) lab(s[0]-12,s[1]+18,p.name.slice(0,34),C.ink,C.panel,'right');
        if (p.U!=null&&!isNaN(p.U)) lab(s[0]+12,s[1]+18,'U '+fmt(p.U),'#fff',C.dim);
      }
    }
    // la bàn: hướng Bắc (N+) và Tây (W+ = -X)
    const cx=W-56, cy=H-56, bs=vpm.b, ax=(v,l,col)=>{ const sx=dot3(v,bs.r), sy=dot3(v,bs.u), L=Math.hypot(sx,sy);
      oc.strokeStyle=col; oc.fillStyle=col; oc.lineWidth=2; oc.beginPath(); oc.moveTo(cx,cy); oc.lineTo(cx+sx*30,cy-sy*30); oc.stroke();
      if (L>0.15){ oc.font='700 12px "Barlow Condensed",sans-serif'; oc.textAlign='center'; oc.textBaseline='middle'; oc.fillText(l,cx+sx*42,cy-sy*42); } };
    ax([0,1,0],'N',C.ink); ax([-1,0,0],'W',C.grid); ax([0,0,1],'U',C.dim);
  }

  /* ---------- giao diện ---------- */
  function renderTabs3(){
    $('tabs').innerHTML = BANDS.map(b=>`<button data-b="${b.k}" class="${b===st.band?'on':''}" title="${b.name}">${b.k==='ALL'?'Tất cả':b.k}${b.z1!=null&&b.z1>-BIG?`<small>≥${(b.z1/1000).toFixed(1)}</small>`:''}</button>`).join('');
    $('tabs').querySelectorAll('button').forEach(x=>x.onclick=()=>{ st.band=BANDS.find(b=>b.k===x.dataset.b); renderTabs3(); fit(); });
  }
  function legend(){
    const el=$('leg3'); if(!el) return;
    el.innerHTML = DISC.map(d=>{ const c=st.ch[d.k]||{}; let s='';
      if (c.status==='loading') s='đang tải…'; else if (c.status==='err') s='lỗi'; else if (c.status==='none') s='không có';
      else if (c.status==='ok') s=(c.meta.name.length).toLocaleString('en-US')+' đt';
      if (FOCUS_ONLY[d.k] && !st.show[d.k]){ const f=(st.focusSet[d.k]||[]).length; s=(f?f+' đang tìm':'chỉ hiện cái đang tìm')+(c.status==='loading'?' · đang tải…':''); }
      const tip = c.err ? esc(c.err) : FOCUS_ONLY[d.k] ? 'Bỏ chọn: chỉ hiện đối tượng đang tìm. Chọn: hiện tất cả.' : '';
      return `<label title="${tip}"><input type="checkbox" data-d="${d.k}" ${st.show[d.k]?'checked':''}><span class="sw" style="background:${d.css};height:10px;width:14px"></span>${d.k} · ${d.name}${FOCUS_ONLY[d.k]?' (tất cả)':''} <small style="font-family:var(--f-mono)">${s}</small></label>`; }).join('')
      + `<label title="Độ đậm của Structure">S mờ <input type="range" id="sA" min="0.1" max="1" step="0.05" value="${st.sAlpha}" style="width:80px"></label>`
      + `<label><input type="checkbox" id="g3" ${st.showGrid?'checked':''}><span class="sw" style="background:var(--grid)"></span>Lưới trục</label>`
      + (st.idx?`<span style="margin-left:auto;font-family:var(--f-mono);font-size:11px">NWD ${esc(String(st.idx.source.exported_at||'').slice(0,10))}</span>`:'');
    $('g3').onchange=e=>{ st.showGrid=e.target.checked?1:0; loop(); };
    $('sA').oninput=e=>{ st.sAlpha=+e.target.value; saveShow(); st.dirty=true; loop(); };
    el.querySelectorAll('input[data-d]').forEach(i=>i.onchange=()=>{ st.show[i.dataset.d]=i.checked?1:0; saveShow(); if(i.checked) loadChunk(i.dataset.d).catch(fail); st.dirty=true; loop(); });
    const errs=DISC.map(d=>st.ch[d.k]).filter(c=>c&&c.status==='err');
    if (errs.length) showMsg('<b>Lỗi dữ liệu 3D:</b> '+errs.map(c=>c.k+': '+esc(c.err)).join('<br>'));
  }
  function saveShow(){ try{ localStorage.setItem('cgf3d-show3',JSON.stringify({show:st.show,sAlpha:st.sAlpha})); }catch(e){} }
  try{ const s=JSON.parse(localStorage.getItem('cgf3d-show3')||'null'); if(s){ Object.assign(st.show,s.show||{}); if(s.sAlpha) st.sAlpha=+s.sAlpha; } }catch(e){}

  /* ---------- chuyển chế độ ---------- */
  function setMode(m){
    S.mode=m; const is3=m==='3d';
    $('m2d').classList.toggle('on',!is3); $('m3d').classList.toggle('on',is3);
    $('m2d').setAttribute('aria-pressed',!is3); $('m3d').setAttribute('aria-pressed',is3);
    cv.hidden=is3; gl3.hidden=!is3; ov.hidden=!is3; $('leg3').hidden=!is3;
    // công cụ bên phải ở 3D: Phóng to, Thu nhỏ, Về điểm đang chọn, Pan, Orbit
    $('zPan').hidden=!is3; $('zRot').hidden=!is3; $('zFit').hidden=is3;
    document.body.classList.toggle('m3d',is3);
    if(!is3) showMsg('');
    try{ localStorage.setItem('cgf3d-mode',m); }catch(e){}
    if (is3){
      vp.classList.add('is3d');
      if (typeof DecompressionStream==='undefined' || !(window.crypto&&crypto.subtle)){ showMsg('Trình duyệt này chưa đủ chức năng để xem 3D (cần giải nén + giải mã). Trên iPhone/iPad hãy cập nhật iOS 16.4 trở lên; trên Android dùng Chrome bản mới.'); return; }
      try{ if(!initGL()) return; }catch(e){ showMsg('Lỗi khởi tạo WebGL: '+esc(e.message)); return; }
      renderTabs3(); legend(); info(st.sel);
      size(); st.dirty=true; loop();
      if (!st.idx) ensureIndex().then(()=>{ legend(); loadAll(); }).catch(fail);
      else if (S.pts[S.act]) focus(S.pts[S.act]);
    } else {
      vp.classList.remove('is3d'); $('readout').classList.add('idle'); $('readout').textContent='Di chuột / chạm vào bản vẽ để xem tọa độ';
      renderTabs(); resize();
    }
  }
  $('m2d').onclick=()=>setMode('2d'); $('m3d').onclick=()=>setMode('3d');
  $('zPan').onclick=()=>setDrag('pan'); $('zRot').onclick=()=>setDrag('rot'); setDrag('rot');
  new ResizeObserver(()=>{ if(S.mode==='3d'){ size(); st.dirty=true; loop(); } }).observe(vp);
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{ st.dirty=true; loop(); });

  return {setMode, focus, fit, fitMulti, zoom, top:topView, renderTabs:renderTabs3,
    band(k){ st.band=BANDS.find(b=>b.k===k)||BANDS[0]; renderTabs3(); fit(); },
    sync(){ if(S.mode!=='3d') return; const p=S.pts[S.act], nm=(p&&p.name)||''; updateFocusSet(); if(nm!==st.lastNm){ st.lastNm=nm; selectByName(nm); } legend(); st.dirty=true; loop(); }};
})();
S.mode='2d';
try{ if (localStorage.getItem('cgf3d-mode')==='3d') setTimeout(()=>V3.setMode('3d'),0); }catch(e){}

}
</script>
